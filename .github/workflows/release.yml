
name: Build and Publish

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Read mod version
        id: mod_version
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $manifest = Get-Content "manifest.json" | ConvertFrom-Json
          $version = $manifest.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          
      - name: Build mod
        run: dotnet build -c Release
        shell: cmd

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 8434059
          filename: "bin/Release/net6.0/SpiceItUpMod ${{ steps.mod_version.outputs.version }}.zip"
          version: ${{ steps.mod_version.outputs.version }}
          display_name: Spice It Up Mod ${{ steps.mod_version.outputs.version }}
          mod_id: 55839
          category: main
          update_mod_version: true
