
name: Build and Publish

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build mod
        run: dotnet build -c Release

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 8434059
          filename: "bin/Release/net6.0/SpiceItUpMod 1.0.0.zip"          
          version: 1.0.0
          mod_id: 55839
          category: main
          display_name: Spice It Up Mod 1.0.0
          update_mod_version: true
